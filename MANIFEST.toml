uuid = "3431b825-145a-4696-9785-542dea651391"
name = "Lyrics Fetcher"
description = "Fetch synced and plain lyrics from NetEase Cloud Music, Kugou and LRCLIB"
version = "3.12.0"
long_description = """
Fetches lyrics from **NetEase Cloud Music**, **Kugou** and **LRCLIB** and writes them into your audio files.

Features:
- Writes **synced lyrics** (with timestamps) to the `syncedlyrics` tag
- Writes **plain lyrics** to the `lyrics` tag
- Optionally exports a `.lrc` sidecar file next to the audio file
- Option to never overwrite lyrics that are already present
- NetEase: drops the leading credits block (作词/作曲/编曲 …) from the lyrics
- Drops credit and metadata lines anywhere in the lyrics, including performer
  credits (作词/作曲/编曲/混音/编程/电吉他/键盘/鼓 …) and empty timestamp lines
- NetEase: can append the Chinese translation to each line (bilingual lyrics)
- Choose the source, or use "NetEase, then Kugou, then LRCLIB" so that a miss
  in one is automatically retried against the next

Requirements:
- MusicBrainz Picard 3.0 or newer
- The `syncedlyrics` tag is only supported for formats that can store it:
  ID3 (MP3) and Vorbis (FLAC, OGG, Opus). It is not supported for MP4/M4A.

Caveats:
- Neither source matches on MusicBrainz IDs; they match on artist, title, album
  and duration, and their coverage is not complete. Mismatches are possible, so it
  is worth skimming the lyrics before saving.
- NetEase and Kugou are used through their public web endpoints. These are
  undocumented and may change or start refusing requests without notice.
"""
api = ["3.0"]
authors = ["sucooer"]
