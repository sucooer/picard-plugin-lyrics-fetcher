[long_description_i18n]
zh_CN = """
从 **网易云音乐**、**酷狗音乐** 和 **LRCLIB** 抓取歌词并写入音频文件。

功能：
- 把**带时间轴的歌词**写进 `syncedlyrics` 标签
- 把**纯文本歌词**写进 `lyrics` 标签
- 可选在音频文件旁导出 `.lrc` 边车文件
- 可选不覆盖文件里已有的歌词
- 网易云：去掉开头的制作人员信息（作词/作曲/编曲 …）
- 去掉歌词中任意位置的制作人员和元信息行，包括演奏者名单
  （作词/作曲/编曲/混音/编程/电吉他/键盘/鼓 …）以及只有时间轴的空行
- 网易云：可以把中文翻译追加到每一行（双语歌词）
- 来源可勾选任意组合，默认按「网易云 → 酷狗 → LRCLIB」依次尝试

要求：
- MusicBrainz Picard 3.0 或更新版本
- `syncedlyrics` 标签只在能存储它的格式上生效：ID3（MP3）和
  Vorbis（FLAC、OGG、Opus）。MP4/M4A 不支持。

注意：
- 各来源都不按 MusicBrainz ID 匹配，而是按艺人、标题、专辑和时长匹配，
  收录率并非 100%。可能存在错配，保存前建议扫一眼歌词。
- 网易云和酷狗走的是公开网页接口，没有官方文档，随时可能变更或拒绝请求。
"""

zh_TW = """
