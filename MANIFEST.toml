- 可選不覆寫檔案裡已有的歌詞
- 網易雲：去掉開頭的製作人員資訊（作詞/作曲/編曲 …）
- 去掉歌詞中任意位置的製作人員和中介資訊行，包括演奏者名單
  （作詞/作曲/編曲/混音/編程/電吉他/鍵盤/鼓 …）以及只有時間軸的空行
- 網易雲：可以把中文翻譯追加到每一行（雙語歌詞）
- 來源可勾選任意組合，預設按「網易雲 → 酷狗 → LRCLIB」依次嘗試

要求：
