  Vorbis（FLAC、OGG、Opus）。MP4/M4A 不支援。

注意：
- 各來源都不按 MusicBrainz ID 匹配，而是按藝人、標題、專輯和時長匹配，
  收錄率並非 100%。可能存在錯配，儲存前建議掃一眼歌詞。
- 網易雲和酷狗走的是公開網頁介面，沒有官方文件，隨時可能變更或拒絕請求。
