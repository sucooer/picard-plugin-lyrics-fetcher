"option.enabled" = "Fetch lyrics automatically"
"option.source" = "Lyrics source:"
"option.source.auto" = "NetEase first, then LRCLIB"
"option.source.netease" = "NetEase only"
"option.source.lrclib" = "LRCLIB only"
"option.write_synced" = "Write synced lyrics (with timestamps) to \"syncedlyrics\" (MP3 only)"
"option.write_plain" = "Write lyrics to the \"lyrics\" tag"
"option.timed_lyrics_in_tag" = "For formats with no synced-lyrics field (FLAC, OGG, M4A), put the timed lyrics into the \"lyrics\" tag"
"option.strip_empty_lrc_lines" = "Drop timestamp-only lines that carry no lyric text"
"option.never_replace" = "Never replace lyrics that are already present"
"option.strip_credits" = "NetEase: drop the leading credits block (作词/作曲/编曲 …)"
"option.add_translation" = "NetEase: append the Chinese translation to each line (bilingual lyrics)"
"option.export_lrc" = "Also export a .lrc file when saving"
"option.auto_lrc" = "Automatically export a .lrc sidecar for formats that cannot store synced lyrics (FLAC, OGG, M4A)"
"option.lrc_never_replace" = "Never replace an existing .lrc file"
"option.lrc_filename" = "Name pattern for the .lrc file:"
"option.note" = "Only MP3 (ID3) has a real field for synced lyrics. FLAC, OGG/Opus and MP4/M4A silently drop the \"syncedlyrics\" tag, so for those the plugin puts the timed lyrics into the \"lyrics\" tag and writes a .lrc sidecar file. Neither source matches on MusicBrainz IDs, so mismatches are possible — skim the lyrics before saving. NetEase is fetched over HTTP/1.1 because its CDN drops Qt's HTTP/2 streams."
