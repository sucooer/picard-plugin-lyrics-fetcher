"option.note" = "Only MP3 (ID3) can store the \"syncedlyrics\" tag — FLAC, OGG/Opus and MP4/M4A silently drop it. For those the plugin writes plain lyrics and, by default, a .lrc sidecar file holding the timestamps. Neither source matches on MusicBrainz IDs, so mismatches are possible — skim the lyrics before saving. NetEase uses undocumented web endpoints and may stop working without notice."
